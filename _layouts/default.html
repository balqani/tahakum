<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
  
<body>

<header class="site-head">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
</header>

<main>
  {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
  {{ content }}
</main>

<nav class="pager">
  {% if page.prev_url %}<a href="{{ page.prev_url | relative_url }}">← {{ page.prev_title }}</a>{% endif %}
  {% if page.next_url %}<a class="next" href="{{ page.next_url | relative_url }}">{{ page.next_title }} →</a>{% endif %}
</nav>

<footer class="site-foot">
  <a href="{{ '/' | relative_url }}">К оглавлению</a>
</footer>
  <script>
  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    if (a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
</script>
  <script>
(function () {
  var key = 'scroll:' + location.pathname;
  var saveTimer;

  // запоминаем позицию при прокрутке
  window.addEventListener('scroll', function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(key, String(window.scrollY)); } catch (e) {}
    }, 300);
  }, { passive: true });

  // восстанавливаем при открытии
  var saved = 0;
  try { saved = parseInt(localStorage.getItem(key) || '0', 10); } catch (e) {}
  if (saved > 300 && !location.hash) {
    requestAnimationFrame(function () {
      window.scrollTo(0, saved);
      var bar = document.createElement('div');
      bar.textContent = 'Продолжили с места, где вы остановились. ';
      var a = document.createElement('a');
      a.href = '#';
      a.textContent = 'В начало';
      a.style.color = '#9fd6c4';
      a.onclick = function (e) {
        e.preventDefault();
        window.scrollTo(0, 0);
        try { localStorage.removeItem(key); } catch (e) {}
        bar.remove();
      };
      bar.appendChild(a);
      bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
        'bottom:1rem;background:#21201d;color:#fff;padding:.6rem 1rem;' +
        'border-radius:4px;font:14px/1.4 "PT Sans",sans-serif;z-index:99;' +
        'box-shadow:0 2px 12px rgba(0,0,0,.25)';
      document.body.appendChild(bar);
      setTimeout(function () { bar.remove(); }, 6000);
    });
  }
})();
</script>
  
<script>
(function () {
  if (!('speechSynthesis' in window)) return;
  var main = document.querySelector('main');
  if (!main) return;

  var btn = document.createElement('button');
  btn.textContent = '▶ Слушать';
  btn.style.cssText = 'display:block;margin:0 auto 2rem;padding:.5rem 1.2rem;' +
    'font:15px "PT Sans",sans-serif;background:#fff;color:#1f5d4c;' +
    'border:1px solid #1f5d4c;border-radius:4px;cursor:pointer';

  var parts = [], idx = 0, speaking = false;

  function build() {
    var copy = main.cloneNode(true);
    // выбрасываем то, что читать не нужно
    copy.querySelectorAll('#markdown-toc, .source, .footnotes, button')
        .forEach(function (el) { el.remove(); });
    var text = copy.innerText
      .replace(/[{}]/g, '')          // скобки аятов не произносим
      .replace(/\s+/g, ' ')
      .trim();
    parts = text.split(/(?<=[.!?…])\s+/).filter(function (s) { return s.trim(); });
  }

  function next() {
    if (idx >= parts.length) { stop(); return; }
    var u = new SpeechSynthesisUtterance(parts[idx]);
    u.lang = 'ru-RU';
    u.rate = 0.95;
    u.onend = function () { idx++; next(); };
    speechSynthesis.speak(u);
  }

  function stop() {
    speechSynthesis.cancel();
    speaking = false; idx = 0;
    btn.textContent = '▶ Слушать';
  }

  btn.onclick = function () {
    if (speaking) { stop(); return; }
    build();
    if (!parts.length) return;
    speaking = true;
    btn.textContent = '⏸ Пауза';
    next();
  };

  main.insertBefore(btn, main.firstChild);
  window.addEventListener('beforeunload', function () { speechSynthesis.cancel(); });
})();
</script>
</body>
</html>
